<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css"></head>
<body>
  <div class="slide" style="align-items:center;justify-content:center;text-align:center;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:32px;">
      <div style="display:flex;align-items:center;gap:28px;">
        <div class="popup-logo" style="width:112px;height:112px;border-radius:30px;font-size:60px;">訳</div>
        <div style="text-align:left;font-size:56px;font-weight:700;line-height:1.06;">Replace AI<br>Translator <span style="color:var(--vermilion);">API</span></div>
      </div>
      <div class="sub" data-t="tagline" style="font-size:27px;color:var(--ink);max-width:900px;text-align:center;"></div>
      <div class="chips" style="justify-content:center;max-width:1040px;">
        <span class="chip"><span class="dot"></span><span data-t="c1"></span></span>
        <span class="chip"><span class="dot"></span><span data-t="c2"></span></span>
        <span class="chip ok"><span class="dot"></span><span data-t="c3"></span></span>
        <span class="chip coral"><span class="dot"></span><span data-t="c4"></span></span>
      </div>
      <div class="providers" style="justify-content:center;margin-top:4px;">
        <span class="badge"><span class="pdot p-openai"></span>OpenAI</span>
        <span class="badge"><span class="pdot p-anthropic"></span>Anthropic</span>
        <span class="badge"><span class="pdot p-gemini"></span>Gemini</span>
        <span class="badge"><span class="pdot p-xai"></span>xAI Grok</span>
        <span class="badge free-pill"><span class="pdot p-mymemory"></span><span data-t="nokey"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
