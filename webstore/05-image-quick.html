<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css"></head>
<body>
  <div class="slide">
    <div class="head">
      <div class="kicker" data-t="kicker"></div>
      <div class="title" data-t="title"></div>
      <div class="sub" data-t="sub"></div>
    </div>
    <div class="body">
      <div style="flex:none;display:flex;flex-direction:column;gap:16px;">
        <div class="imgwrap">
          <div class="photo"><div class="img-orig" data-t="imgOrig"></div></div>
          <div class="img-overlay" data-t="imgT1"></div>
          <div class="img-overlay two" data-t="imgT2"></div>
          <div class="hover-btn">訳</div>
        </div>
        <div class="foot" style="margin-top:2px;"><span class="fdot"></span><span data-t="imgNote"></span></div>
      </div>
      <div class="quick">
        <div class="quick-head"><span data-t="quickTitle"></span><span class="qflow" data-t="quickFlow"></span></div>
        <div class="qbox" data-t="quickIn"></div>
        <div class="qbox out" data-t="quickOut"></div>
        <div class="qbar"><span data-t="quickChars"></span><span class="spacer"></span><span class="qchip" data-t="quickCopy"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
