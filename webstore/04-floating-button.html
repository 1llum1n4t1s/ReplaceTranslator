<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css"></head>
<body>
  <div class="slide">
    <div class="head">
      <div class="kicker" data-t="kicker"></div>
      <div class="title" data-t="title"></div>
    </div>
    <div class="body" style="align-items:stretch;">
      <div class="split">
        <div class="browser">
          <div class="browser-bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="urlbar">example.com/article</span></div>
          <div class="page">
            <span class="tagline-pill pill-before" data-t="beforeTag"></span>
            <div class="ph" data-t="beforeH"></div>
            <p data-t="beforeP"></p>
          </div>
        </div>
        <div class="browser">
          <div class="browser-bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="urlbar">example.com/article</span></div>
          <div class="page translated">
            <span class="tagline-pill pill-after" data-t="afterTag"></span>
            <div class="ph" data-t="afterH"></div>
            <p data-t="afterP"></p>
          </div>
          <div class="fab" style="right:20px;bottom:20px;">原</div>
        </div>
      </div>
    </div>
    <div class="foot"><span class="fdot"></span><span data-t="foot"></span></div>
  </div>
</body>
</html>
