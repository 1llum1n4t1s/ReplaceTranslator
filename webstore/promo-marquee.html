<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><link rel="stylesheet" href="theme.css"></head>
<body>
  <div class="promo promo-marquee">
    <div class="mq-left">
      <div style="display:flex;align-items:center;gap:26px;">
        <div class="promo-logo">訳</div>
        <div class="promo-name">Replace AI<br>Translator <span style="color:var(--vermilion)">API</span></div>
      </div>
      <div class="promo-tag" data-t="tag"></div>
    </div>
    <div class="mq-right">
      <span class="chip"><span class="dot"></span><span data-t="c1"></span></span>
      <span class="chip"><span class="dot"></span><span data-t="c2"></span></span>
      <span class="chip ok"><span class="dot"></span><span data-t="c3"></span></span>
      <div class="providers" style="margin-top:6px;">
        <span class="badge"><span class="pdot p-openai"></span>OpenAI</span>
        <span class="badge"><span class="pdot p-anthropic"></span>Anthropic</span>
        <span class="badge"><span class="pdot p-gemini"></span>Gemini</span>
        <span class="badge"><span class="pdot p-xai"></span>xAI Grok</span>
        <span class="badge free-pill"><span class="pdot p-mymemory"></span><span data-t="nokey"></span></span>
      </div>
    </div>
  </div>
</body>
</html>
