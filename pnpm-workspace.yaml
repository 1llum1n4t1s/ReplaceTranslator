minimumReleaseAgeExclude:
  - '@kagayoi/support-extension@1.0.6'
  - adm-zip@0.6.1

# undici: web-ext > addons-linter > cheerio 経由の transitive 脆弱性
# (GHSA-g8m3-5g58-fq7m 等 7 件) を修正版へ強制。dev 専用で拡張本体には同梱されない
overrides:
  # web-ext の推移依存に対する脆弱性修正。上流が取り込むまで安全な版へ固定する
  adm-zip: ">=0.6.1 <1"
  js-yaml: ">=4.3.2 <5"
  undici: ">=7.28.0 <9"
