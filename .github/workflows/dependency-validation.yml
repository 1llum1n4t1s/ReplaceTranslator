name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify R2 transfer protocol offline
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Setup Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Install locked dependencies
        run: bun run deps
      - name: Validate AMO listing metadata
        run: bun test ./scripts/New-AmoMetadata.test.mjs
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support
      - name: Validate 1
        run: bun --bun run sync:support --check
      - name: Validate 2
        run: bun --bun run test
      - name: Validate 3
        run: bun --bun run lint
