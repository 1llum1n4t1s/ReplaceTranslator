name: Publish to Chrome Web Store + Firefox AMO

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    name: ZIP パッケージ作成
    runs-on: ubuntu-latest
    outputs:
      artifact-attempt: ${{ steps.artifact-identity.outputs.attempt }}
      version: ${{ steps.version.outputs.version }}
      zip_sha256: ${{ steps.verify-zip.outputs.sha256 }}
    steps:
      - name: Record native artifact producer attempt
        id: artifact-identity
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: 同梱ディレクトリを取得
        run: |
          # ローカルの各 OS と同じ package-dirs.txt を正本にする。
          # manifest.json は target 別(Chrome=純正 / Firefox=生成)なので各 step で個別に扱う。
          echo "PKG_DIRS=$(tr -d '\r\n' < package-dirs.txt)" >> "$GITHUB_ENV"

      - name: バージョンを取得
        id: version
        run: |
          # Chrome/Firefox は単一 manifest.json を共有するため version 取得元も 1 本
          version=$(jq -r '.version' manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::manifest.json の version 取得に失敗しました"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: 依存インストール
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support

      - name: テスト実行
        run: bun --bun run test

      - name: 静的検証
        run: |
          bun --bun run lint
          # truthy 判定だけではパス typo の壊れた ZIP を素通しするため、manifest 参照先の実在まで確認する
          bun - <<'NODE'
          const fs = require("node:fs");
          const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const required = {
            "background.service_worker": m.background?.service_worker,
            "action.default_popup": m.action?.default_popup,
          };
          for (const cs of m.content_scripts || []) {
            for (const f of [...(cs.js || []), ...(cs.css || [])]) required[`content_scripts:${f}`] = f;
          }
          for (const [name, file] of Object.entries(required)) {
            if (typeof file !== "string" || !fs.existsSync(file)) {
              throw new Error(`${name} の参照先が不正です: ${file}`);
            }
          }
          NODE

      - name: zip パッケージを作成
        run: |
          # _locales/ は manifest.json の default_locale 参照先。含めないと CWS の Submit for review で
          # PKG_DEFAULT_LOCALE_MISSING エラーになる。同梱ディレクトリは package-dirs.txt から取得した $PKG_DIRS を使う。
          zip -r replace-translator.zip manifest.json $PKG_DIRS \
            -x "*.DS_Store" "*.swp" "*~"
          ls -lh replace-translator.zip

      - name: 提出用ZIP実物の版・構成・source一致を検証
        id: verify-zip
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun verify-release-package.mjs replace-translator.zip chrome "$EXPECTED_VERSION" . > "$RUNNER_TEMP/chrome-verified.json"
          echo "sha256=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/chrome-verified.json"))["sha256"])')" >> "$GITHUB_OUTPUT"

      - name: ZIP artifact を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'replace-translator-zip' -Path @('replace-translator.zip') | Out-Null

      - name: Firefox 用ソースディレクトリを構築
        run: |
          # ソース manifest.json は Chrome 純正(service_worker)。Firefox は service_worker 非対応のため
          # build-firefox-manifest.mjs で background.scripts 形式へ変換する(importScripts を単一ソースに生成)。
          mkdir -p firefox-build
          bun build-firefox-manifest.mjs firefox-build/manifest.json
          # 同梱ディレクトリは Chrome zip と同じ package-dirs.txt 由来の $PKG_DIRS を使う。
          for d in $PKG_DIRS; do cp -r "$d" firefox-build/; done
          find firefox-build \( -name "*.DS_Store" -o -name "*.swp" -o -name "*~" \) -delete
          echo "📂 firefox-build 内容:"
          ls -la firefox-build/

      - name: Firefox manifest 検証
        run: bun --bun run web-ext lint --source-dir firefox-build

      - name: Firefox source artifact を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'replace-translator-firefox-source' -Path @('firefox-build/') | Out-Null

  publish:
    name: Chrome Web Store にアップロード + Submit for review
    runs-on: ubuntu-latest
    needs: package
    environment: chrome-web-store
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: ZIP artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'replace-translator-zip' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: 検証済みZIPとアップロードする実物のhashを照合
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.zip_sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          echo "$EXPECTED_SHA256  replace-translator.zip" | sha256sum --check

      - name: Chrome Web Store に検証済み ZIP を HTTP 提出
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "replace-translator.zip" -ExpectedSha256 "${{ needs.package.outputs.zip_sha256 }}" -CheckExistingVersion -ExistingVersionPolicy Published

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # package(テスト/ビルド/artifact 生成)が成功したときだけ走る。CWS publish ジョブとは独立(両者 needs: package)
    # なので CWS publish が失敗しても Firefox は出せる。package 失敗時は firefox-source artifact が無く、
    # 旧 success()||failure() だと download-artifact が二次エラーで赤くなり障害切り分けを濁すため result 判定にする。
    if: ${{ needs.package.result == 'success' }}
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: Firefox source artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'replace-translator-firefox-source' -Destination 'firefox-build/' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Prepare Bun build toolchain
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json

      - name: web-ext 依存インストール
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: bun run deps
      - name: Validate dependency security patches
        run: bun run test:dependencies
      - name: Sync support assets
        run: bun --bun run sync:support

      - name: AMO listing メタデータを生成
        run: |
          # webstore/store-listing.firefox.{ja,en}.txt + package.json と scripts/New-AmoMetadata.ps1 内の公開メタデータを入力として
          # amo-metadata.json（名前/概要/説明/カテゴリ/homepage/support_url/version.license）を生成。
          pwsh -NoProfile -File scripts/New-AmoMetadata.ps1

      - name: Firefox AMO に HTTP submission
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e firefox-build/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory firefox-build -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("firefox-build/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; m=json.load(open("firefox-build/manifest.json")); print(m.get("browser_specific_settings",m.get("applications",{}))["gecko"]["id"])')
          bun verify-release-package.mjs "$ARCHIVE" firefox "$VERSION" firefox-build > web-ext-artifacts/verified.json
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/verified.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"
