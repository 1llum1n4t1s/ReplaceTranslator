[install]
# 公開直後24時間は、明示的に検証済みの例外だけ許可する。
minimumReleaseAge = 86400
# 自作の @kagayoi スコープのパッケージは公開元を自分で管理しているため、パッケージ名で全バージョンを待機の対象外にする。
# Bun はスコープのワイルドカード (@kagayoi/*) を受け付けないので、新しく公開したら名前をここへ追加する。
# 他者のパッケージは従来どおり「name@version」で検証済みの版だけを例外にする。
minimumReleaseAgeExcludes = [
  "@kagayoi/support-extension",
  "@kagayoi/cws-mcp",
  "@kagayoi/proton-pass-mcp",
  "@kagayoi/app-publish-mcp",
  "@kagayoi/hatena-blog-mcp",
  "@kagayoi/retroweb-mcp",
  "adm-zip@0.6.1",
]

[run]
# CLIのnode shebangもBunで実行する。
bun = true
